<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wein per Pedes Standliste | Kindenheimer Kerweborsch</title>

    <meta name="description" content="Standliste und Angebote der Stationen bei Wein per Pedes.">
    <meta name="keywords" content="Wein per Pedes Standliste, Kindenheimer Kerweborsch Angebote">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://kindenheimer-kerweborsch.de/wein-per-pedes/standliste.html">
    <meta property="og:site_name" content="Kindenheimer Kerweborsch">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Wein per Pedes Standliste | Kindenheimer Kerweborsch">
    <meta property="og:description" content="Standliste und Angebote der Stationen bei Wein per Pedes.">
    <meta property="og:url" content="https://kindenheimer-kerweborsch.de/wein-per-pedes/standliste.html">
    <meta property="og:image" content="https://kindenheimer-kerweborsch.de/wein-per-pedes/wppLogo.svg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Wein per Pedes Standliste | Kindenheimer Kerweborsch">
    <meta name="twitter:description" content="Standliste und Angebote der Stationen bei Wein per Pedes.">
    <meta name="twitter:image" content="https://kindenheimer-kerweborsch.de/wein-per-pedes/wppLogo.svg">
    <!-- /SEO -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #faf7f2;
      --cream-dark: #f0ebe0;
      --forest: #3d6b4a;
      --forest-dark: #263f2f;
      --gold: #b8792a;
      --gold-light: #c99040;
      --ink: #1c1c1c;
      --muted: #555;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #d8d0c2;
      font-family: 'Lato', Arial, sans-serif;
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .sheet {
      width: 794px;
      min-height: 1123px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(rgba(250,247,242,0.91), rgba(250,247,242,0.94)),
        url('../logo.jpg') center 52% / 430px auto no-repeat,
        radial-gradient(circle at 18% 8%, rgba(184,121,42,0.18), transparent 30%),
        radial-gradient(circle at 85% 92%, rgba(61,107,74,0.18), transparent 35%),
        var(--cream);
      border: 14px solid var(--forest);
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.24);
      padding: 42px 48px 38px;
    }
    .sheet::before,
    .sheet::after {
      content: "";
      position: absolute;
      inset: 22px;
      border: 2px solid rgba(184,121,42,0.55);
      border-radius: 4px;
      pointer-events: none;
    }
    .sheet::after {
      inset: 30px;
      border-color: rgba(61,107,74,0.20);
    }
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding-bottom: 22px;
      border-bottom: 3px double rgba(184,121,42,0.65);
    }
    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 8px;
    }
    .wpp-logo {
      width: 82px;
      height: 82px;
      border-radius: 18px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.16);
      background: #fff;
      padding: 6px;
    }
    .kicker {
      color: var(--gold);
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: 14px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 62px;
      line-height: .95;
      color: var(--forest);
      margin: 4px 0 8px;
      font-weight: 900;
    }
    .subtitle {
      font-size: 19px;
      color: var(--forest-dark);
      font-weight: 700;
    }
    main { position: relative; z-index: 1; padding-top: 24px; }
    .intro {
      text-align: center;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
      max-width: 620px;
      margin: 0 auto 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
    }
    .station {
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(61,107,74,0.18);
      border-left: 6px solid var(--gold);
      border-radius: 12px;
      padding: 14px 15px 12px;
      box-shadow: 0 4px 14px rgba(38,63,47,0.08);
      break-inside: avoid;
    }
    .station h2 {
      margin: 0 0 8px;
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--forest);
      font-size: 22px;
      line-height: 1.05;
    }
    .station p {
      margin: 0 0 10px;
      font-size: 12px;
      color: #5a554f;
      line-height: 1.35;
      min-height: 32px;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 5px 0;
      border-top: 1px dashed rgba(184,121,42,0.28);
      font-size: 14px;
      line-height: 1.2;
    }
    li:first-child { border-top: 0; }
    li::before { content: "🍷"; font-size: 12px; margin-top: 1px; }
    .price { margin-left: auto; color: var(--gold); font-weight: 900; white-space: nowrap; }
    footer {
      position: absolute;
      z-index: 1;
      left: 48px;
      right: 48px;
      bottom: 34px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: var(--forest-dark);
      font-size: 13px;
      font-weight: 700;
      border-top: 2px solid rgba(184,121,42,0.45);
      padding-top: 14px;
    }
    @media print {
      body { padding: 0; background: white; }
      .sheet { box-shadow: none; border-radius: 0; }
    }
  </style>
</head>
<body>
  <section class="sheet">
    <header>
      <div class="logo-row">
        <img class="wpp-logo" src="./wppLogo.svg" alt="Wein per Pedes Logo">
        <div>
          <div class="kicker">Kindenheim · Bockenheim</div>
          <h1>Standliste</h1>
          <div class="subtitle">Wein per Pedes · 10. Mai 2026</div>
        </div>
      </div>
    </header>

    <main>
      <p class="intro">Alle Stände und Angebote der 8 Stationen auf einen Blick — ohne Preisangaben.</p>
      <div class="grid" id="stations"></div>
    </main>

    <footer>
      <span>🍇 20 Jahre Wein per Pedes</span>
      <span>kindenheimer-kerweborsch.de</span>
    </footer>
  </section>

  <script src="./map/stations.js"></script>
  <script>
    const root = document.getElementById('stations');
    stations.forEach(station => {
      const card = document.createElement('article');
      card.className = 'station';
      const items = station.offerings.map(o => `<li><span>${o.name}</span><span class="price">${o.price || ''}</span></li>`).join('');
      card.innerHTML = `<h2>${station.name}</h2><ul>${items}</ul>`;
      root.appendChild(card);
    });
  </script>
</body>
</html>
